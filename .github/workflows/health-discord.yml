# 배포 URL의 /health 를 검사하고, 실패 시에만 Discord 알림 (슬립 방지는 render-ping.yml 사용)
name: Health check (Discord on failure)

on:
  schedule:
    # UTC 기준 5분마다 — 장애 감지·본문 status 검증
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install production deps
        run: npm install --omit=dev

      - name: Run health check (notifies Discord only on failure)
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          SERVER_PUBLIC_URL: ${{ secrets.SERVER_PUBLIC_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEALTH_TIMEOUT_MS: '100000'
        run: |
          # HEALTH_URL 우선, 없으면 SERVER_PUBLIC_URL/health (한 시크릿만 써도 됨)
          export EFFECTIVE_HEALTH_URL="${HEALTH_URL:-${SERVER_PUBLIC_URL}/health}"
          if [ -z "$EFFECTIVE_HEALTH_URL" ] || [ "$EFFECTIVE_HEALTH_URL" = "/health" ]; then
            echo "::error::HEALTH_URL 또는 SERVER_PUBLIC_URL 중 하나를 설정하세요."
            exit 1
          fi
          export HEALTH_URL="$EFFECTIVE_HEALTH_URL"
          node scripts/health-check-discord.js
